services:
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/London}
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - ./downloads:/downloads
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  telegram-bot:
    image: ghcr.io/okslo/torrentbot:latest
    container_name: telegram-bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - QBIT_HOST=http://qbittorrent:8080
      - QBIT_USERNAME=${QBIT_USERNAME:-admin}
      - QBIT_PASSWORD=${QBIT_PASSWORD}
      - DOWNLOAD_PATH=/downloads
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QBIT_MCP_URL=http://qbittorrent-mcp:3000/sse
      - JELLYFIN_MCP_URL=http://jellyfin-mcp:8080/mcp
      - MCP_HTTP_TOKEN=${MCP_HTTP_TOKEN}
    volumes:
      - ./downloads:/downloads
      - ./data:/data
    depends_on:
      - qbittorrent
      - qbittorrent-mcp
      - jellyfin-mcp
    restart: unless-stopped

  qbittorrent-mcp:
    image: ghcr.io/nicholaswilde/qbittorrent-mcp-rs:latest
    container_name: qbittorrent-mcp
    environment:
      - QBITTORRENT_HOST=http://qbittorrent:8080
      - QBITTORRENT_USERNAME=${QBIT_USERNAME:-admin}
      - QBITTORRENT_PASSWORD=${QBIT_PASSWORD}
      - QBITTORRENT_SERVER_MODE=http
    ports:
      - "3000:3000"
    depends_on:
      qbittorrent:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  jellyfin-mcp:
    image: ghcr.io/jaredtrent/jellyfin-mcp:latest
    container_name: jellyfin-mcp
    env_file:
      - path: ./config/jellyfin.env
        required: false
    environment:
      JELLYFIN_URL: "http://jellyfin:8096"
    command: ["--http", "--addr", "0.0.0.0:8080", "--http-token", "${MCP_HTTP_TOKEN}"]
    ports:
      - "8081:8080"
    depends_on:
      jellyfin:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  samba:
    image: dperson/samba:latest
    container_name: samba
    environment:
      - TZ=${TZ:-Europe/London}
    command: >
      -s "downloads;/mnt/downloads;yes;yes;yes"
      -p
    volumes:
      - ./downloads:/mnt/downloads
    ports:
      - "139:139"
      - "445:445"
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    volumes:
      - ./config/jellyfin:/config
      - ./downloads:/media:ro
    ports:
      - "8096:8096"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8096/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  setup:
    image: ghcr.io/okslo/torrentbot-setup:latest
    container_name: setup
    volumes:
      - ./config:/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - QBIT_USERNAME=${QBIT_USERNAME:-admin}
      - QBIT_PASSWORD=${QBIT_PASSWORD}
      - JELLYFIN_USERNAME=${JELLYFIN_USERNAME:-admin}
      - JELLYFIN_PASSWORD=${JELLYFIN_PASSWORD}
    depends_on:
      qbittorrent:
        condition: service_healthy
      jellyfin:
        condition: service_healthy
    restart: on-failure
