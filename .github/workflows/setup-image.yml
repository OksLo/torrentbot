name: Build and push setup image

on:
  push:
    paths:
      - 'setup/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the repository name automatically,
          # producing e.g. ghcr.io/okslo/torrentbot-setup
          images: ghcr.io/${{ github.repository }}-setup
          tags: |
            # short git SHA for every push, e.g. ghcr.io/okslo/torrentbot-setup:abc1234
            type=sha,prefix=
            # 'latest' only on the default branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./setup
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # cache layers in the GitHub Actions cache to speed up rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container smoke tests
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | sed '/^[[:space:]]*$/d' | head -n1)
          echo "Testing image: $IMAGE"
          docker run --rm "$IMAGE" python -m pip check
          docker run --rm "$IMAGE" python -m py_compile setup.py
          docker run --rm "$IMAGE" python smoke_test.py

      - name: Push image
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | sed '/^[[:space:]]*$/d'); do
            docker push "$tag"
          done
